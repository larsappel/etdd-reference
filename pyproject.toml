[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "library-loan"
version = "0.1.0"
description = "Worked demonstration of Extreme TDD — agent-built Python CLI library-loan tracker"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Lars Appel" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
library-loan = "library_loan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
