name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check outcome ↔ test pairing
        run: python scripts/check_pairing.py
      - name: Run tests
        run: |
          set +e
          pytest
          code=$?
          if [ "$code" = "5" ]; then
            echo "No tests collected yet (pytest exit code 5) — treating as OK for baseline only."
            exit 0
          fi
          exit "$code"
